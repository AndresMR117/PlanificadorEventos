<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios - Planificador IA</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .servicios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .servicio-card { background: white; border-radius: 20px; padding: 20px; transition: transform 0.2s; }
        .servicio-card:hover { transform: translateY(-5px); }
        .filtros { display: flex; gap: 15px; margin-bottom: 30px; justify-content: center; flex-wrap: wrap; }
        .filtros select, .filtros button { padding: 10px 20px; border-radius: 25px; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="nav-brand">🎉 Planificador IA</div>
            <div class="nav-center" id="nav-center"></div>
            <div class="nav-right" id="auth-buttons"></div>
        </nav>
        <h2 class="section-title">📋 Servicios por Tipo de Evento</h2>
        <div class="filtros">
            <select id="tipo-evento-select">
                <option value="">Selecciona un tipo de evento</option>
            </select>
            <button class="btn btn-primary" onclick="cargarServiciosPorTipo(document.getElementById('tipo-evento-select').value)">Buscar</button>
        </div>
        <div id="servicios-container" class="servicios-grid"></div>
    </div>
    <script src="/js/api.js"></script>
    <script>
        cargarTiposEvento();
    </script>
</body>
</html>
