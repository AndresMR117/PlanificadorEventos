<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green: #2ECC71;
            --green-dark: #1a9e52;
            --green-deep: #0f7a3a;
            --green-light: #d4f5e2;
            --green-muted: rgba(46,204,113,0.12);
            --bg: #f7f8f6;
            --text: #1a1a2e;
            --muted: #6b7280;
            --border: #e5e7eb;
            --card-bg: #ffffff;
            --radius: 16px;
            --red: #ef4444;
            --yellow: #f59e0b;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            height: 60px;
            background: rgba(247,248,246,0.95);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
            cursor: pointer;
        }

        .nav-brand .brand-icon {
            width: 28px;
            height: 28px;
            background: var(--green);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: white;
        }

        .nav-center {
            display: flex;
            gap: 4px;
        }

        .nav-center button {
            background: none;
            border: none;
            padding: 7px 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            position: relative;
        }

        .nav-center button:hover { color: var(--text); }
        .nav-center button.active {
            color: var(--text);
            font-weight: 600;
        }
        .nav-center button.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: var(--green);
            border-radius: 2px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-right button, .nav-right a {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 7px 16px;
            border-radius: 9px;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: all 0.2s;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--green-light);
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--green);
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar i { font-size: 0.8rem; color: var(--green-dark); }

        /* ── PAGE WRAP ── */
        .page-wrap {
            max-width: 1140px;
            margin: 0 auto;
            padding: 40px 40px 80px;
        }

        /* ── PAGE HEADER ── */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .page-header-left h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .page-header-left p {
            font-size: 0.875rem;
            color: var(--muted);
        }

        .page-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-header {
            position: relative;
        }

        .search-header i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.8rem;
        }

        .search-header input {
            padding: 10px 14px 10px 34px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            color: var(--text);
            background: white;
            outline: none;
            width: 220px;
            transition: all 0.2s;
        }

        .search-header input::placeholder { color: var(--muted); }

        .search-header input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px var(--green-muted);
        }

        .btn-nuevo {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-nuevo:hover { background: var(--green-dark); }

        /* ── STAT CARDS ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-deep) 100%);
            border-radius: var(--radius);
            padding: 24px 24px 20px;
            color: white;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s ease;
        }

        .stat-card:hover { transform: translateY(-3px); }

        .stat-card::after {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
        }

        .stat-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat-icon {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .stat-card-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            opacity: 0.85;
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 12px;
            font-family: 'DM Sans', sans-serif;
        }

        .stat-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            opacity: 0.75;
        }

        .stat-dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--green);
        }

        /* ── TABLE SECTION ── */
        .table-section {
            background: white;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .table-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
        }

        .filter-tab {
            padding: 7px 16px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: white;
            color: var(--muted);
            transition: all 0.2s;
        }

        .filter-tab:hover { border-color: var(--green); color: var(--green); }

        .filter-tab.active {
            background: var(--green);
            border-color: var(--green);
            color: white;
        }

        /* ── TABLE ── */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 680px;
        }

        .admin-table thead th {
            padding: 12px 20px;
            text-align: left;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }

        .admin-table tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        .admin-table tbody tr:last-child { border-bottom: none; }
        .admin-table tbody tr:hover { background: #fafffe; }

        .admin-table td {
            padding: 14px 20px;
            font-size: 0.875rem;
            color: var(--text);
            vertical-align: middle;
        }

        .td-id {
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .td-nombre {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--green-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--green-dark);
            flex-shrink: 0;
            overflow: hidden;
        }

        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .nombre-text {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .email-text {
            font-size: 0.82rem;
            color: var(--muted);
        }

        /* Role badges */
        .role-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .role-admin {
            background: var(--green);
            color: white;
        }

        .role-cliente {
            background: rgba(37,99,235,0.12);
            color: #2563eb;
        }

        /* Action icons */
        .action-icons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.2s;
            background: none;
        }

        .icon-btn-view { color: var(--green); }
        .icon-btn-view:hover { background: var(--green-muted); }

        .icon-btn-edit { color: var(--yellow); }
        .icon-btn-edit:hover { background: rgba(245,158,11,0.1); }

        .icon-btn-del { color: var(--red); }
        .icon-btn-del:hover { background: rgba(239,68,68,0.1); }

        /* ── PAGINATION ── */
        .table-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }

        .table-count {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .page-btn {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .page-btn:hover { border-color: var(--green); color: var(--green); }
        .page-btn.active { background: var(--green); border-color: var(--green); color: white; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── EMPTY / LOADING ── */
        .table-empty {
            text-align: center;
            padding: 50px 20px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        /* ── MODAL ── */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 28px;
            max-width: 400px;
            width: 100%;
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 20px;
        }

        .modal-title i {
            width: 34px;
            height: 34px;
            background: var(--green-muted);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--green-dark);
            font-size: 0.9rem;
        }

        .modal-content select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            color: var(--text);
            background: white;
            outline: none;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        .modal-content select:focus { border-color: var(--green); }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-modal-cancel {
            padding: 10px 20px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-modal-cancel:hover { border-color: var(--text); color: var(--text); }

        .btn-modal-save {
            padding: 10px 22px;
            background: var(--green);
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-modal-save:hover { background: var(--green-dark); }

        /* ── OVERFLOW TABLE ── */
        .table-overflow { overflow-x: auto; }

        /* ── RESPONSIVE ── */
        @media (max-width: 860px) {
            .page-wrap { padding: 28px 20px 60px; }
            .navbar { padding: 0 20px; }
            .nav-center { display: none; }
            .stats-grid { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; }
            .page-header-right { width: 100%; flex-wrap: wrap; }
            .search-header input { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ── NAVBAR ── -->
    <nav class="navbar">
        <div class="nav-brand" onclick="window.location.href='/index.html'">
            <div class="brand-icon">✦</div>
             Flow Events
        </div>
        <div class="nav-center" id="navCenter"></div>
        <div class="nav-right" id="auth-buttons">
            <div class="avatar"><i class="fas fa-user"></i></div>
        </div>
    </nav>

    <div class="page-wrap">

        <!-- ── PAGE HEADER ── -->
        <div class="page-header">
            <div class="page-header-left">
                <h1>Gestión de Usuarios</h1>
                <p>Administra el acceso y monitorea el flujo de recursos de tu red.</p>
            </div>
            <div class="page-header-right">
                <div class="search-header">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Buscar usuario..."
                           oninput="filtrarUsuarios()" onkeyup="filtrarUsuarios()">
                </div>
                <button class="btn-nuevo">
                    <i class="fas fa-user-plus"></i> Nuevo Usuario
                </button>
            </div>
        </div>

        <!-- ── STAT CARDS ── -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-card-header">
                    <div class="stat-icon"><i class="fas fa-users"></i></div>
                    <div class="stat-card-label">Usuarios Totales</div>
                </div>
                <div class="stat-val" id="totalUsuarios">0</div>
                <div class="stat-card-footer">
                    <span>Activos ahora</span>
                    <div class="stat-dot"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-header">
                    <div class="stat-icon"><i class="fas fa-shield-alt"></i></div>
                    <div class="stat-card-label">Administradores</div>
                </div>
                <div class="stat-val" id="totalAdmins">0</div>
                <div class="stat-card-footer">
                    <span>Nivel de Acceso Total</span>
                    <div class="stat-dot"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-header">
                    <div class="stat-icon"><i class="fas fa-user-circle"></i></div>
                    <div class="stat-card-label">Clientes</div>
                </div>
                <div class="stat-val" id="totalClientes">0</div>
                <div class="stat-card-footer">
                    <span>Cuentas Externas</span>
                    <div class="stat-dot"></div>
                </div>
            </div>
        </div>

        <!-- ── TABLE ── -->
        <div class="table-section">
            <div class="table-toolbar">
                <div class="filter-tabs">
                    <button class="filter-tab active" onclick="filterByRole('todos', this)">Todos</button>
                    <button class="filter-tab" onclick="filterByRole('admin', this)">Administradores</button>
                    <button class="filter-tab" onclick="filterByRole('cliente', this)">Clientes</button>
                </div>
            </div>

            <div class="table-overflow">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NOMBRE</th>
                            <th>CORREO</th>
                            <th>ROL</th>
                            <th>REGISTRADO</th>
                            <th style="text-align:right">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="usuariosTableBody">
                        <tr><td colspan="6" class="table-empty">Cargando usuarios...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="table-footer">
                <div class="table-count" id="tableCount">Mostrando 0 usuarios</div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>

    </div>

    <script src="/js/api.js"></script>
    <script>
        let todosUsuarios = [];
        let currentFilter = 'todos';
        let currentSearch = '';
        let currentPage = 1;
        const PER_PAGE = 10;

        // ── NAVBAR POR ROL ──
        function actualizarNavbarAdmin() {
            const navCenter = document.getElementById('navCenter');
            if (!navCenter) return;

            const esAdmin = typeof usuarioActual !== 'undefined' && usuarioActual && usuarioActual.rol === 'admin';

            let botones = `
                <button onclick="window.location.href='/index.html'">Inicio</button>
            `;

            if (esAdmin) {
                botones += `
                    <button class="active" onclick="window.location.href='/pages/admin/usuarios.html'">Usuarios</button>
                    <button onclick="window.location.href='/pages/admin/proveedores.html'">Proveedores</button>
                    <button onclick="window.location.href='/pages/admin/planes.html'">Planes</button>
                `;
            }

            navCenter.innerHTML = botones;
        }

        // ── CARGAR USUARIOS ──
        async function cargarUsuarios() {
            try {
                const usuarios = await apiRequest('/usuarios/');
                todosUsuarios = usuarios;
                actualizarEstadisticas();
                renderizarTabla();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('usuariosTableBody').innerHTML =
                    '<tr><td colspan="6" class="table-empty">❌ Error al cargar usuarios</td></tr>';
            }
        }

        // ── ESTADÍSTICAS ──
        function actualizarEstadisticas() {
            document.getElementById('totalUsuarios').textContent = todosUsuarios.length;
            document.getElementById('totalAdmins').textContent = todosUsuarios.filter(u => u.rol === 'admin').length;
            document.getElementById('totalClientes').textContent = todosUsuarios.filter(u => u.rol === 'cliente').length;
        }

        // ── FILTRAR ──
        function filtrarUsuarios() {
            currentSearch = document.getElementById('searchInput').value.toLowerCase();
            currentPage = 1;
            renderizarTabla();
        }

        function filterByRole(rol, btn) {
            currentFilter = rol;
            currentPage = 1;
            document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderizarTabla();
        }

        // ── INICIALES ──
        function getInitials(nombre) {
            if (!nombre) return '?';
            return nombre.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        // ── RENDERIZAR TABLA ──
        function renderizarTabla() {
            let filtrados = [...todosUsuarios];

            if (currentFilter !== 'todos') {
                filtrados = filtrados.filter(u => u.rol === currentFilter);
            }

            if (currentSearch) {
                filtrados = filtrados.filter(u =>
                    (u.nombre && u.nombre.toLowerCase().includes(currentSearch)) ||
                    (u.email && u.email.toLowerCase().includes(currentSearch))
                );
            }

            const total = filtrados.length;
            const totalPages = Math.ceil(total / PER_PAGE);
            const start = (currentPage - 1) * PER_PAGE;
            const paginated = filtrados.slice(start, start + PER_PAGE);

            // Count
            document.getElementById('tableCount').textContent =
                `Mostrando ${start + 1}–${Math.min(start + PER_PAGE, total)} de ${total} usuarios`;

            const tbody = document.getElementById('usuariosTableBody');

            if (paginated.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="table-empty">📭 No se encontraron usuarios</td></tr>';
                renderPagination(0, 0);
                return;
            }

            tbody.innerHTML = paginated.map((u, i) => {
                const num = String(start + i + 1).padStart(3, '0');
                const initials = getInitials(u.nombre);
                const isAdmin = u.rol === 'admin';

                return `
                <tr>
                    <td class="td-id">#${num}</td>
                    <td>
                        <div class="td-nombre">
                            <div class="user-avatar">${initials}</div>
                            <span class="nombre-text">${escapeHTML(u.nombre)}</span>
                        </div>
                    </td>
                    <td class="email-text">${escapeHTML(u.email)}</td>
                    <td>
                        <span class="role-badge ${isAdmin ? 'role-admin' : 'role-cliente'}">
                            ${isAdmin ? 'Admin' : 'Cliente'}
                        </span>
                    </td>
                    <td style="color:var(--muted);font-size:0.82rem">${formatearFecha(u.created_at)}</td>
                    <td>
                        <div class="action-icons" style="justify-content:flex-end">
                            <button class="icon-btn icon-btn-view" title="Ver" onclick="editarRol(${u.id}, '${u.rol}')">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="icon-btn icon-btn-edit" title="Editar rol" onclick="editarRol(${u.id}, '${u.rol}')">
                                <i class="fas fa-pen"></i>
                            </button>
                            ${!isAdmin ? `<button class="icon-btn icon-btn-del" title="Eliminar" onclick="eliminarUsuario(${u.id})">
                                <i class="fas fa-trash"></i>
                            </button>` : ''}
                        </div>
                    </td>
                </tr>`;
            }).join('');

            renderPagination(currentPage, totalPages);
        }

        // ── PAGINACIÓN ──
        function renderPagination(current, total) {
            const container = document.getElementById('pagination');
            if (total <= 1) { container.innerHTML = ''; return; }

            let html = `<button class="page-btn" onclick="goPage(${current - 1})" ${current === 1 ? 'disabled' : ''}>
                <i class="fas fa-chevron-left" style="font-size:0.65rem"></i>
            </button>`;

            for (let i = 1; i <= Math.min(total, 5); i++) {
                html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
            }

            html += `<button class="page-btn" onclick="goPage(${current + 1})" ${current === total ? 'disabled' : ''}>
                <i class="fas fa-chevron-right" style="font-size:0.65rem"></i>
            </button>`;

            container.innerHTML = html;
        }

        function goPage(page) {
            currentPage = page;
            renderizarTabla();
        }

        // ── EDITAR ROL ──
        async function editarRol(userId, rolActual) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-title">
                        <i class="fas fa-user-tag"></i>
                        Cambiar Rol de Usuario
                    </div>
                    <select id="nuevoRol">
                        <option value="cliente" ${rolActual === 'cliente' ? 'selected' : ''}>👤 Cliente</option>
                        <option value="admin" ${rolActual === 'admin' ? 'selected' : ''}>👑 Administrador</option>
                    </select>
                    <div class="modal-footer">
                        <button class="btn-modal-cancel" onclick="this.closest('.modal').remove()">Cancelar</button>
                        <button class="btn-modal-save" onclick="guardarRol(${userId}, document.getElementById('nuevoRol').value)">Guardar</button>
                    </div>
                </div>`;
            modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
            document.body.appendChild(modal);
        }

        // ── GUARDAR ROL ──
        async function guardarRol(userId, nuevoRol) {
            try {
                const usuarios = await apiRequest('/usuarios/');
                const usuario = usuarios.find(u => u.id === userId);

                const response = await fetch(`${API_URL}/usuarios/${userId}/`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...usuario, rol: nuevoRol })
                });

                if (response.ok) {
                    document.querySelector('.modal')?.remove();
                    cargarUsuarios();
                } else {
                    alert('❌ Error al actualizar rol');
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // ── ELIMINAR USUARIO ──
        async function eliminarUsuario(userId) {
            if (!confirm('¿Estás seguro de eliminar este usuario? Esta acción no se puede deshacer.')) return;
            try {
                const response = await fetch(`${API_URL}/usuarios/${userId}/`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    cargarUsuarios();
                } else {
                    alert('❌ Error al eliminar usuario');
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        function formatearFecha(fecha) {
            if (!fecha) return '—';
            const d = new Date(fecha);
            return d.toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function verificarAccesoAdmin() {
            if (typeof usuarioActual === 'undefined' || !usuarioActual || usuarioActual.rol !== 'admin') {
                alert('⛔ Acceso denegado. Solo administradores.');
                window.location.href = '/index.html';
                return false;
            }
            return true;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (verificarAccesoAdmin()) {
                actualizarNavbarAdmin();
                cargarUsuarios();
            }
        });

        // Exponer globales
        window.filtrarUsuarios = filtrarUsuarios;
        window.filterByRole = filterByRole;
        window.editarRol = editarRol;
        window.guardarRol = guardarRol;
        window.eliminarUsuario = eliminarUsuario;
        window.goPage = goPage;
    </script>
</body>
</html>
